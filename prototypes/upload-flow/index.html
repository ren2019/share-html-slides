<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸飞机 · 装订交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#242424;font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;--light:#a3a3a3;--dark:#171717}button,select{font:inherit;cursor:pointer}button{padding:10px 18px;border:1px solid #d8d8d2;background:white;border-radius:7px}button.primary{background:var(--dark);color:white;border-color:var(--dark)}button:disabled{opacity:.4;cursor:default}header{padding:22px 5%;display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid #ddd}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:600}.icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--light),var(--dark));padding:7px}main{max-width:1200px;margin:45px auto 160px;padding:0 30px}h1{font:36px/1.3 Georgia,'Songti SC',serif;margin:12px 0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0}p{color:#73736c}.eyebrow{font-size:12px;letter-spacing:2px;color:#85857e}.panel{background:white;border:1px solid #ddd;border-radius:12px;padding:25px}.muted{color:#777;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:19px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.tag{font-size:12px;padding:4px 8px;background:#efefeb;border-radius:4px}.warning{background:#fbf4df;border:1px solid #eadcb4;padding:15px;border-radius:7px;margin:20px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.two{display:grid;grid-template-columns:1fr 330px;gap:24px}.steps{display:flex;gap:30px;margin:30px 0;padding-bottom:16px;border-bottom:1px solid #ddd}.active{color:var(--dark);font-weight:700}.aside{border-left:3px solid var(--dark);padding-left:18px}.workbench{display:grid;grid-template-columns:210px 1fr 290px;gap:20px}.nav{padding:22px;background:#eaeae5;border-radius:10px}.nav strong{display:block;margin-bottom:25px}.sectionnav{padding:14px 0;border-bottom:1px solid #d4d4ce}.preview{min-height:200px;background:#f5f4ef;border:1px solid #ddd;padding:25px;margin-top:16px}footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;border-top:1px solid #ddd;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}.switch{border-radius:28px;background:#222;color:white;padding:5px;display:flex;align-items:center;gap:15px}.switch button{background:transparent;color:white;border:0;padding:6px 15px}details{font-size:12px;max-width:420px}pre{max-height:150px;overflow:auto;white-space:pre-wrap}dialog{border:1px solid #ccc;border-radius:14px;padding:30px;max-width:650px;width:90%}dialog::backdrop{background:#0005}textarea{width:100%;min-height:110px;padding:16px;font:inherit;border:1px solid #ddd}select{padding:7px;border:1px solid #ddd;background:white;border-radius:6px}.notice{padding:8px 5%;background:#eeeae0;font-size:12px}.finish{font-size:35px;color:var(--dark)}@media(max-width:850px){.two,.workbench{grid-template-columns:1fr}.nav{display:none}footer{flex-wrap:wrap}details{max-width:100%}main{margin-top:20px}header{gap:15px}.steps{gap:15px;font-size:12px}}
</style>
<div class="notice">交互原型 · 合成材料 · 无真实上传与持久化。问题：哪种结构最容易理解关联文件与独立发布？</div>
<header><div class="brand"><svg class="icon" viewBox="0 0 100 100"><path fill="white" d="M7 41 92 10 64 90 40 69 33 85 29 56Z"/><path fill="#d1d8e0" d="M29 56 92 10 40 69 33 85Z"/><path fill="#eef1f5" d="M40 69 92 10 64 90Z"/></svg>纸飞机</div><div><select id="theme" aria-label="主题"></select> <span class="muted">演示发布者</span></div></header>
<main id="app"></main><footer><div class="switch"><button onclick="cycle(-1)" aria-label="上一方案">←</button><span id="variant"></span><button onclick="cycle(1)" aria-label="下一方案">→</button></div><button onclick="reset()">重置演示</button><details><summary id="stateLabel">原型状态</summary><pre id="state"></pre></details></footer><dialog id="modal"></dialog>
<script>
// PROTOTYPE: three structurally different upload flows; no production entry or persistence.
const themes=[['松烟墨','#a3a3a3','#171717'],['沧海蓝','#3975b8','#051c2c'],['暮山紫','#cf62ff','#57008f'],['竹简青','#58d68d','#07532c'],['霁空蓝','#78a9ff','#0f62fe']];
const names={A:'A · 材料库＋装订面板',B:'B · 三步向导',C:'C · 文件关系工作台'};let variant=new URLSearchParams(location.search).get('variant')||'A';if(!names[variant])variant='A';let state={selected:false,matched:false,published:false,partial:false,theme:0};
const app=document.getElementById('app'),modal=document.getElementById('modal');
themes.forEach((t,i)=>document.getElementById('theme').add(new Option(t[0],i)));document.getElementById('theme').onchange=e=>{state.theme=+e.target.value;document.body.style.setProperty('--light',themes[state.theme][1]);document.body.style.setProperty('--dark',themes[state.theme][2]);render()};
function reset(){state={selected:false,matched:false,published:false,partial:false,theme:state.theme};render()}
function cycle(n){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+n+3)%3];history.replaceState(null,'','?variant='+variant);render()}
addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||modal.open)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});addEventListener('popstate',()=>{variant=new URLSearchParams(location.search).get('variant')||'A';render()});
function act(a){if(a==='select')state.selected=true;if(a==='match')state.matched=true;if(a==='publish'){state.published=true;state.partial=!state.matched}render()}
function files(){return `<div class="row"><div><h3>增长策略.html</h3><span class="muted">你选择的主文件 · 幻灯片</span></div><span class="tag">${state.published?'已发布':'新材料'}</span></div><div class="row"><div><h3>案例解读.html</h3><span class="muted">普通链接引用 · 将独立发布</span></div><span class="tag">${state.matched?(state.published?'已发布':'已补齐'):'缺少文件'}</span></div><div class="row"><div><h3>数据说明.html</h3><span class="muted">嵌入页面 · 将独立发布</span></div><span class="tag">${state.matched?(state.published?'已发布':'已补齐'):'缺少文件'}</span></div><div class="row"><span>配图与样式 · 3 个资源</span><span class="muted">${state.matched?'已就绪':'待匹配'}</span></div>`}
function body(){if(state.published)return `<div class="finish">发布完成</div><p>${state.partial?'主文件已发布；两个缺失的关联 HTML 未发布。':'3 份 HTML 已独立发布，可以分别分享和管理。'}</p>${state.partial?'<div class="warning">这份内容仍缺少资源，关联位置可能无法阅读。</div>':''}<div class="row"><strong>增长策略</strong><button onclick="share('增长策略')">分享</button></div>${!state.partial?['案例解读','数据说明'].map(t=>`<div class="row"><strong>${t}</strong><button onclick="share('${t}')">分享</button></div>`).join(''):''}<div class="actions"><button onclick="preview()">打开阅读预览</button><button onclick="reset()">再发布一份</button></div>`;
if(!state.selected)return `<h2>把已有的 HTML 放进来</h2><p>我们发现关联文件，你确认后发布。<br>不需要编辑代码，也不需要部署网站。</p><div class="preview"><strong>演示材料：增长策略.html</strong><p>包含两个关联 HTML 和三份静态资源。</p><button class="primary" onclick="act('select')">选择演示 HTML</button></div>`;
return `<h2>${state.matched?'文件已齐，可以预览':'发现了需要一起带上的文件'}</h2>${files()}${!state.matched?'<div class="warning">请提供主文件所在文件夹，系统会匹配需要的文件；无关文件不会加入队列。</div>':'<p>关联只是避免漏传。发布后，每份 HTML 都是独立材料。</p>'}<div class="actions">${!state.matched?'<button class="primary" onclick="act(\'match\')">模拟选择文件夹并补齐</button>':''}<button onclick="preview()">预览</button>${state.matched?'<button class="primary" onclick="act(\'publish\')">发布 3 份材料</button>':'<button onclick="confirmPartial()">仍然发布主文件</button>'}</div>`}
function render(){const phase=state.published?'发布完成':state.matched?'待发布':state.selected?'需补齐':'待选择';document.getElementById('variant').textContent=names[variant];document.getElementById('stateLabel').textContent='原型状态 · '+phase;document.getElementById('state').textContent=JSON.stringify({variant,...state},null,2);console.log('PROTOTYPE', {variant,...state});
if(variant==='A')app.innerHTML=`<div class="eyebrow">YOUR MATERIALS</div><h1>材料库</h1><p>让内容，抵达。</p><div class="two"><section class="panel"><h2>我的材料</h2>${state.published?'<div class="row">本次发布已加入材料库 <span class="tag">'+(state.partial?'1':'3')+' 份</span></div>':'<p>书架还是空的。右侧开始第一次发布。</p>'}<div class="preview"><h3>已有 HTML，轻松分享</h3><p>发到微信，任何能打开的人都能继续分享。</p></div></section><section class="panel">${body()}</section></div>`;
if(variant==='B')app.innerHTML=`<div style="max-width:790px;margin:auto"><div class="eyebrow">PUBLISH A PAGE</div><h1>把内容，交到读者手中。</h1><div class="steps"><span class="${!state.selected?'active':''}">01 选择 HTML</span><span class="${state.selected&&!state.published?'active':''}">02 补齐与预览</span><span class="${state.published?'active':''}">03 发布与分享</span></div><section class="panel">${body()}</section></div>`;
if(variant==='C')app.innerHTML=`<div class="eyebrow">BINDING DESK</div><h1>装订工作台</h1><p>先看清文件关系，再一起发布。</p><div class="workbench"><aside class="nav"><strong>本次装订</strong><div class="sectionnav">增长策略.html</div><div class="sectionnav">↳ 案例解读.html</div><div class="sectionnav">↳ 数据说明.html</div><p>演示文件关系<br>各材料独立管理</p></aside><section class="panel">${body()}</section><aside class="aside"><h2>发布摘要</h2><p>主文件：${state.selected?1:0}<br>关联 HTML：${state.selected?2:0}<br>已匹配资源：${state.matched?3:0}</p><hr><p>当前：${phase}</p><p>关联 HTML 独立生成链接。图片与样式随内容保存。</p></aside></div>`}
function closeDialog(){modal.close()}function preview(){modal.innerHTML=`<span class="eyebrow">合成阅读预览</span><h1>增长的下一步</h1><p>从机会识别，到行动共识。</p><div class="preview"><h2>01 / 看清问题</h2><p>用明确的事实连接判断，让每一次沟通都能向前一步。</p></div><p>${state.matched?'关联页面已补齐。':'案例解读与数据说明暂不可用。'}</p><button onclick="closeDialog()">返回装订</button>`;modal.showModal()}
function confirmPartial(){modal.innerHTML='<h2>仍然发布不完整内容？</h2><p>缺少两个关联 HTML 和三份静态资源。只发布主文件，阅读可能不完整。</p><div class="actions"><button onclick="closeDialog()">返回补齐</button><button class="primary" onclick="closeDialog();act(\'publish\')">确认仍然发布</button></div>';modal.showModal()}
function share(t){modal.innerHTML=`<h2>分享 ${t}</h2><p>模拟分享链接，仅用于评审，不能对外阅读。</p><textarea id="copyText">给你分享《${t}》\nhttps://paperplane.example/demo</textarea><div class="actions"><button onclick="closeDialog()">关闭</button><button class="primary" id="copy" onclick="navigator.clipboard.writeText(document.getElementById('copyText').value).then(()=>this.textContent='已复制').catch(()=>this.textContent='请选中文字复制')">复制分享文案</button></div>`;modal.showModal()}render();
</script></html>
